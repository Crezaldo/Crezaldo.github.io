<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f5f9;padding:20px}
.container{max-width:900px;margin:auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{color:#0f172a} h1 span{color:#22c55e}
.top{display:flex;justify-content:space-between;align-items:center;margin:16px 0}
.top button{background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:#0f172a;color:#fff;padding:16px;border-radius:12px;text-align:center}
.stat b{font-size:24px;display:block}
.form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;flex:1;min-width:140px}
.btn-add{background:#22c55e;border:none;padding:11px 20px;border-radius:8px;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:14px}
th{background:#f8fafc}
.btn-del{background:#fee2e2;color:#dc2626;border:none;padding:6px 12px;border-radius:6px;cursor:pointer}
#login{max-width:400px;margin:80px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
#login input{width:100%;margin:8px 0}
#login button{width:100%;background:#22c55e;border:none;padding:12px;border-radius:8px;font-weight:800;cursor:pointer;margin-top:10px}
.hidden{display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>Student <span>Management</span></h1>
  <p style="color:#64748b;margin:10px 0">Login untuk masuk ke sistem</p>
  <input id="user" placeholder="Username: admin">
  <input id="pass" type="password" placeholder="Password: 12345">
  <button onclick="login()">Login →</button>
  <p style="font-size:12px;color:#94a3b8;margin-top:12px">Demo: admin / 12345</p>
</div>

<!-- DASHBOARD -->
<div class="container hidden" id="app">
  <h1>Student <span>Management System</span></h1>
  <p style="color:#64748b">DIT - Dili, Timor-Leste</p>
  <div class="top">
    <p>Selamat datang, <b>Admin</b></p>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="total">0</b>Total Siswa</div>
    <div class="stat"><b id="laki">0</b>Laki-laki</div>
    <div class="stat"><b id="perempuan">0</b>Perempuan</div>
  </div>

  <div class="form">
    <input id="nama" placeholder="Nama Siswa">
    <select id="kelas"><option>TI - Semester 1</option><option>TI - Semester 3</option><option>TI - Semester 5</option></select>
    <select id="jk"><option>Laki-laki</option><option>Perempuan</option></select>
    <input id="nilai" type="number" placeholder="Nilai 0-100">
    <button class="btn-add" onclick="tambah()">+ Tambah Siswa</button>
  </div>

  <table>
    <thead><tr><th>Nama</th><th>Kelas</th><th>Jenis Kelamin</th><th>Nilai</th><th>Status</th><th>Aksi</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
  <br><a href="index.html">← Kembali ke Portofolio</a>
</div>

<script>
let siswa = JSON.parse(localStorage.getItem('siswa') || '[{"nama":"Joao Pereira","kelas":"TI - Semester 3","jk":"Laki-laki","nilai":85},{"nama":"Maria Alves","kelas":"TI - Semester 1","jk":"Perempuan","nilai":92}]');

function login(){
  if(document.getElementById('user').value==='admin' && document.getElementById('pass').value==='12345'){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();
  } else { alert('Salah! Coba admin / 12345'); }
}
function logout(){ location.reload(); }
function tambah(){
  let nama=document.getElementById('nama').value;
  let nilai=document.getElementById('nilai').value;
  if(!nama || !nilai) return alert('Isi nama dan nilai dulu!');
  siswa.push({nama, kelas:document.getElementById('kelas').value, jk:document.getElementById('jk').value, nilai:parseInt(nilai)});
  localStorage.setItem('siswa', JSON.stringify(siswa));
  document.getElementById('nama').value=''; document.getElementById('nilai').value='';
  render();
}
function hapus(i){ siswa.splice(i,1); localStorage.setItem('siswa', JSON.stringify(siswa)); render(); }
function render(){
  document.getElementById('total').innerText = siswa.length;
  document.getElementById('laki').innerText = siswa.filter(s=>s.jk==='Laki-laki').length;
  document.getElementById('perempuan').innerText = siswa.filter(s=>s.jk==='Perempuan').length;
  document.getElementById('list').innerHTML = siswa.map((s,i)=>`
    <tr><td><b>${s.nama}</b></td><td>${s.kelas}</td><td>${s.jk}</td><td>${s.nilai}</td><td>${s.nilai>=70?'✅ Lulus':'❌ Remedial'}</td><td><button class="btn-del" onclick="hapus(${i})">Hapus</button></td></tr>
  `).join('');
}
</script>
</body>
</html>
